<!DOCTYPE html>
<html>
<head>
  <title>Gợi ý phim</title>
</head>
<body>
  <h2>Gợi ý phim cho người dùng</h2>
  <form method="post">
    {% csrf_token %}
    <label for="user_id">Nhập userID:</label>
    <input type="text" name="user_id" required>
    <button type="submit">Gợi ý</button>
  </form>

  {% if recommendations %}
    <h3>Top phim gợi ý:</h3>
    <ul>
      {% for movie in recommendations %}
        <li>{{ movie }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</body>
</html>
