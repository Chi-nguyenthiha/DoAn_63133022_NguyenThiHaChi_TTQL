<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🎀 Movie Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-pink">
    <div class="container mt-5">
        <div class="card pastel-card mx-auto p-4">
            <h1 class="text-center text-pink mb-4">🍿 Movie Recommender</h1>
            <form action="/recommend" method="POST">
                <div class="mb-3">
                    <label for="user_type" class="form-label">Select User Type:</label>
                    <select class="form-select" name="user_type" id="user_type" onchange="toggleForm()">
                        <option value="new">New User</option>
                        <option value="old">Existing User</option>
                    </select>
                </div>

                <div id="new_user_form">
                    <h5 class="text-pink">New User Details:</h5>
                    <input class="form-control mb-2" type="number" name="age" placeholder="Age" required>
                    <input class="form-control mb-2" type="text" name="occupation" placeholder="Occupation" required>
                    <select class="form-select mb-2" name="gender" required>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                    <div class="mb-2">
                        <label class="form-label">Preferred Genres:</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="genres" value="Action">
                            <label class="form-check-label">Action</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="genres" value="Comedy">
                            <label class="form-check-label">Comedy</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="genres" value="Drama">
                            <label class="form-check-label">Drama</label>
                        </div>
                    </div>
                </div>

                <div id="old_user_form" style="display:none;">
                    <h5 class="text-pink">Old User ID:</h5>
                    <input class="form-control" type="number" name="old_user_id" placeholder="User ID (e.g., 400)">
                </div>

                <button type="submit" class="btn btn-pink mt-3 w-100">✨ Recommend</button>
            </form>
        </div>
    </div>

    <script>
        function toggleForm() {
            var userType = document.getElementById('user_type').value;
            if (userType == 'new') {
                document.getElementById('new_user_form').style.display = 'block';
                document.getElementById('old_user_form').style.display = 'none';
            } else {
                document.getElementById('new_user_form').style.display = 'none';
                document.getElementById('old_user_form').style.display = 'block';
            }
        }
    </script>
</body>
</html>
